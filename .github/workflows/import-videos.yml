name: Import source videos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-videos.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Download and optimize videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/btf-import public/videos imports/video-metadata

          download_video() {
            local name="$1"
            local primary_url="$2"
            local fallback_url="${3:-}"
            local output="/tmp/btf-import/${name}.%(ext)s"

            if ! yt-dlp --no-playlist --write-info-json \
              -f 'bv*[height<=720]+ba/b[height<=720]/b' \
              --merge-output-format mp4 -o "$output" "$primary_url"; then
              if [[ -z "$fallback_url" ]]; then
                return 1
              fi
              yt-dlp --no-playlist --write-info-json \
                -f 'bv*[height<=720]+ba/b[height<=720]/b' \
                --merge-output-format mp4 -o "$output" "$fallback_url"
            fi

            local input
            input="$(find /tmp/btf-import -maxdepth 1 -type f -name "${name}.*" ! -name '*.json' | head -n 1)"
            test -n "$input"

            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -map_metadata -1 -vf "scale='min(720,iw)':-2" \
              -c:v libx264 -preset medium -crf 28 \
              -c:a aac -b:a 96k -movflags +faststart \
              "public/videos/${name}.mp4"

            jq '{id, title, description, duration, uploader, upload_date, webpage_url}' \
              "/tmp/btf-import/${name}.info.json" > "imports/video-metadata/${name}.json"
          }

          download_video 'instagram-DemO6D5NDb9' \
            'https://www.kkinstagram.com/reels/DemO6D5NDb9/' \
            'https://www.instagram.com/reel/DemO6D5NDb9/'
          download_video 'instagram-DejUMzyjNrB' \
            'https://www.kkinstagram.com/reels/DejUMzyjNrB/' \
            'https://www.instagram.com/reel/DejUMzyjNrB/'
          download_video 'instagram-DepJmG2usmG' \
            'https://www.kkinstagram.com/reels/DepJmG2usmG/' \
            'https://www.instagram.com/reel/DepJmG2usmG/'
          download_video 'instagram-Deps9Q_ikY7' \
            'https://www.kkinstagram.com/reel/Deps9Q_ikY7/' \
            'https://www.instagram.com/reel/Deps9Q_ikY7/'
          download_video 'bluesky-3my7rffo6sk2n' \
            'https://bsky.app/profile/npa-antica.bsky.social/post/3my7rffo6sk2n'

      - name: Commit imported videos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos imports/video-metadata
          git commit -m 'Import source videos'
          git push
