<article class="guide-page" id="apres-la-gav" aria-labelledby="after-custody-title">
  <div class="guide-inner guide-inner-wide section-shell">
    <a class="guide-back" href="documentation/"><span aria-hidden="true">←</span> Documentation</a>

    <div class="documentation-switch-layout">
      <header class="guide-header documentation-switch-heading">
        <p>05</p>
        <h1 id="after-custody-title">Après la GAV</h1>
        <p>Ce que vous devez faire APRÈS une GAV.</p>
      </header>

      <div class="documentation-switcher">
        <nav class="documentation-tabs" role="tablist" aria-label="Étapes après la garde à vue">
          @for (entry of entries; track entry.number; let index = $index) {
            <button type="button" class="documentation-tab" [class.is-active]="selectedEntry === index" [attr.aria-selected]="selectedEntry === index" [attr.aria-controls]="'custody-panel'" [id]="'custody-tab-' + index" role="tab" (click)="selectedEntry = index">
              <span>{{ entry.number }}</span>
              <strong>{{ entry.title }}</strong>
            </button>
          }
        </nav>

        <section class="documentation-panel" id="custody-panel" role="tabpanel" [attr.aria-labelledby]="'custody-tab-' + selectedEntry">
          <p class="documentation-panel-index">Module {{ activeEntry.number }}</p>
          <h2>{{ activeEntry.title }}</h2>
          @for (paragraph of activeEntry.paragraphs; track paragraph) {
            <p>{{ paragraph }}</p>
          }
        </section>
      </div>
    </div>
  </div>
</article>
